services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in the root .env file}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      NEO4J_ENABLED: "true"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:5173"]}
    depends_on:
      neo4j-import:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

  neo4j:
    image: neo4j:5.20-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in the root .env file}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - ./neo4j:/var/lib/neo4j/import/scripts
      - ./data:/var/lib/neo4j/import/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $${NEO4J_USER} -p $${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j-import:
    image: neo4j:5.20-community
    depends_on:
      neo4j:
        condition: service_healthy
    entrypoint: ["cypher-shell"]
    command: ["-a", "bolt://neo4j:7687", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in the root .env file}", "-f", "/neo4j_import.cypher"]
    volumes:
      - ./neo4j/neo4j_import.cypher:/neo4j_import.cypher:ro

volumes:
  neo4j_data:
